services:
  # 1. Banco de Dados Relacional (Operacional)
  postgres:
    image: postgres:latest
    container_name: corewms_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - corewms_postgres_data:/var/lib/postgresql
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. Banco de Dados NoSQL (Logs de Auditoria)
  mongodb:
    image: mongo:latest
    container_name: corewms_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - corewms_mongo_data:/data/db
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 3. Backend (API .NET)
  corewms-api:
    container_name: corewms_api
    build:
      context: ./CoreWMS.Api
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Postgres=Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
      - ConnectionStrings__MongoDb=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/corewms_audit?authSource=admin
      - JwtSettings__Secret=${JWT_SECRET}
      - CryptoSettings__Key=${CRYPTO_KEY}
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS}
      - App__PublicBaseUrl=${APP_PUBLIC_URL}
      - GoogleOAuth__ClientId=${GOOGLE_CLIENT_ID}
      - GoogleOAuth__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - GoogleOAuth__RedirectUri=${APP_PUBLIC_URL}/api/companies/google-oauth/callback
    volumes:
      - corewms_uploads:/app/uploads
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # 4. Frontend Web (React)
  frontend:
    container_name: corewms_frontend
    build:
      context: ./corewms-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${APP_PUBLIC_URL}
    ports:
      - "3000:80"
    depends_on:
      - corewms-api
    restart: unless-stopped

volumes:
  corewms_postgres_data:
  corewms_mongo_data:
  corewms_uploads: